{% extends 'base.html' %}
<title>Регистрация</title>
{% block content %}

<div class="container-fluid">
    <main>
        <section class="text-center container">
            <div class="row py-lg-0">
                <div class="col-lg-6 col-md-8 mx-auto">
                    {% if object %}
                    <h1 class="fw-light">Регистрация пользователя</h1>
                    {% else %}
                    <h1 class="fw-light">Редактирование пользователя</h1>
                    {% endif %}
                </div>
            </div>
        </section>
    </main>

    <div class="container">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="col-6">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    {% if object %}
                    <button type="submit" class="btn btn-primary">
                        Зарегистрироваться
                    </button>
                    {% else %}
                    <button type="submit" class="btn btn-primary">
                        Сохранить
                    </button>
                    {% endif %}
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
