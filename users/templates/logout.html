{% extends 'base.html' %}

{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center">Вы уверены, что хотите выйти?</h2>
                    <p class="card-text text-center">Нажмите "Выйти" для завершения сеанса.</p>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'mailing:home' %}" class="btn btn-secondary">Отмена</a>
                        <a href="{% url 'users:login' %}" class="btn btn-danger">Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
