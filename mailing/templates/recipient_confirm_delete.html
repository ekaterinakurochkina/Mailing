{% extends "base.html" %}
<title>Удаление получателя рассылки</title>


{% block content %}
<h2>Удаление получателя рассылки</h2>
    <p>Вы уверены, что хотите удалить получателя "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailing:recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </form>

    <a href="{% url 'mailing:recipient_list' %}" class="btn btn-primary">Вернуться</a>

{% endblock %}
