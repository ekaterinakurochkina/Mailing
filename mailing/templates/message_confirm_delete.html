{% extends "base.html" %}
<title>Удаление</title>
{% block content %}
<div class="container-fluid">
    <main>
        <section class="text-center container">
            <div class="row py-lg-0">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-light">Удаление сообщения</h1>
                    <p>Вы уверены, что хотите удалить сообщение "{{ object.name }}"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Удалить</button>
                        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>
<p></p>
<div style="text-align: center; margin-top: 0px; margin-bottom: 30px;">
    <a class="btn btn-primary " button
       style="width: 540px; color: white; padding: 10px 10px; border: none; border-radius: 4px; cursor: pointer"
       href="{% url 'mailing:message_list' %}">Вернуться</a>
</div>
{% endblock %}
